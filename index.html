<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linux in a tab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Linux in a tab</h1>
    <p class="lede">A small Linux computer running inside your browser. Click the screen to type. Save its state and it will be waiting for you next visit.</p>

    <div class="controls">
      <button id="save">Save state</button>
      <button id="load">Load saved state</button>
      <button id="delete">Delete saved state</button>
      <button id="reset">Restart</button>
      <label><input type="checkbox" id="autosave"> Save every minute</label>
    </div>
    <p id="status" role="status">Loading…</p>

    <div id="screen_container">
      <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
      <canvas></canvas>
    </div>
  </main>

  <script src="lib/libv86.js"></script>
  <script src="app.js"></script>
</body>
</html>
