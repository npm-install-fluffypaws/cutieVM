<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>My VM</title></head>
<body>
  <h1>My VM</h1>
  <textarea id="code" rows="10" cols="40">PUSH 5
DUP
PRINT
PUSH 1
SUB
DUP
JNZ 1
HALT</textarea><br>
  <button onclick="go()">Run</button>
  <pre id="out"></pre>
  <script src="vm.js"></script>
  <script>
    function go() {
      const program = document.getElementById("code").value
        .split("\n").filter(l => l.trim())
        .map(l => { const [op, a] = l.trim().split(/\s+/); return [op, a === undefined ? undefined : Number(a)]; });
      const out = document.getElementById("out");
      out.textContent = "";
      run(program, v => out.textContent += v + "\n");
    }
  </script>
</body>
</html>
